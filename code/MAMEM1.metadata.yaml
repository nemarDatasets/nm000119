abstract: Brain-computer interfaces (BCIs) have been gaining momentum in making human-computer interaction more natural, especially
  for people with neuro-muscular disabilities. This report focuses on SSVEP-based BCIs and performs a comparative evaluation
  of the most promising algorithms. A dataset of 256-channel EEG signals from 11 subjects is provided, along with a processing
  toolbox for reproducing results and supporting further experimentation.
