methodology: Empirical approach where each signal processing parameter (filtering, artifact removal, feature extraction, feature
  selection, classification) is studied independently by keeping all other parameters fixed. Leave-one-subject-out cross-validation
  used to evaluate system without subject-specific training. Multiple algorithms compared for each processing stage to obtain
  state-of-the-art baseline.
